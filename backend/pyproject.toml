[project]
name = "api"
version = "1.0.0"
description = "Modern FastAPI backend service with PostgreSQL"
requires-python = ">=3.11,<3.13"
dependencies = [
    # FastAPI & ASGI
    "fastapi>=0.104.1,<0.110",
    "uvicorn[standard]>=0.24.0,<0.30.0",
    "python-multipart>=0.0.6,<0.1.0",  # File upload support

    # Database & ORM
    "sqlalchemy[asyncio]>=2.0.23,<3.0.0",  # SQLAlchemy 2.0+ with async support
    "asyncpg>=0.29.0,<0.30.0",  # Async PostgreSQL driver
    "alembic>=1.13.0,<2.0.0",  # Database migrations

    # Validation & Serialization
    "pydantic>=2.5.0,<3.0.0",
    "pydantic-settings>=2.1.0,<3.0.0",

    # Authentication & Security
    "pyjwt[crypto]>=2.8.0,<3.0.0",
    "bcrypt>=4.1.2,<5.0.0",
    "python-jose[cryptography]>=3.3.0,<4.0.0",

    # HTTP Client
    "httpx>=0.25.2,<0.28.0",  # Modern async HTTP client

    # Caching & Queue
    "redis[hiredis]>=5.0.1,<6.0.0",  # Redis with optimized parser

    # Logging & Monitoring
    "loguru>=0.7.2,<0.8.0",  # Structured logging
    "prometheus-fastapi-instrumentator>=6.1.0,<7.0.0",

    # WebSocket Support
    "python-socketio>=5.10.0,<6.0.0",
    "websockets>=12.0,<13.0",

    # External Services
    "aiogram>=3.3.0,<4.0.0",  # Modern Telegram bot framework
    "gspread>=5.12.0,<6.0.0",  # Google Sheets API
    "google-auth>=2.25.0,<3.0.0",  # Google authentication

    # Development & Utilities
    "python-dotenv>=1.0.0,<2.0.0",  # Environment variables
]

[tool.uv]
dev-dependencies = [
    # Testing
    "pytest>=7.4.3,<8.0.0",
    "pytest-asyncio>=0.21.1,<0.22.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "httpx>=0.25.2,<0.28.0",  # For API testing
    "pytest-mock>=3.12.0,<4.0.0",

    # Database Testing
    "pytest-postgresql>=5.0.0,<6.0.0",  # PostgreSQL test fixtures
    "sqlalchemy-utils>=0.41.1,<0.42.0",  # Database testing utilities

    # Code Quality
    "ruff>=0.1.7,<0.2.0",  # Fast linter and formatter
    "mypy>=1.7.1,<2.0.0",  # Type checking
    "pre-commit>=3.6.0,<4.0.0",  # Git hooks

    # Development Tools
    "ipython>=8.17.2,<9.0.0",  # Interactive Python shell
    "rich>=13.7.0,<14.0.0",  # Pretty printing and debugging
]

[tool.ruff]
target-version = "py311"
line-length = 88
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "N",   # pep8-naming
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by formatter
    "B008",  # do not perform function calls in argument defaults
    "N818",  # exception name should be named with an Error suffix
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__.py
"tests/*" = ["N802", "N803"]  # test functions can have non-conforming names

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
namespace_packages = true

[[tool.mypy.overrides]]
module = [
    "consys.*",
    "libdev.*",
    "gspread.*",
    "aiogram.*",
    "socketio.*",
    "prometheus_fastapi_instrumentator.*"
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow running tests",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/venv/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
