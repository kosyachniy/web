# Development environment overrides (remote development server)
# Same as local but for remote development environments
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  api:
    environment:
      WEB: http://localhost/
    volumes:
      # For hot reload in development
      - ../../backend/app:/app
    command: bash -c "cd /app && uv run uvicorn main:app --host 0.0.0.0 --port 5000 --proxy-headers --reload"

  web:
    build:
      context: ../../frontend
      target: development
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API: http://localhost/api/
      NEXT_PUBLIC_WEB: http://localhost/
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      # For hot reload in development
      - ../../frontend:/app
      # Exclude to avoid conflicts and cache issues
      - /app/node_modules
      - /app/.next
      - /app/.swc
    command: npm run dev
