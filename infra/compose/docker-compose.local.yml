# Local development overrides
# Adds databases, nginx server, and development-specific configurations
# Usage: docker compose -f docker-compose.yml -f docker-compose.local.yml up

services:
  redis:
    image: redis:8.2-alpine
    restart: unless-stopped
    env_file: ../../.env
    volumes:
      - ${DATA_PATH}/redis:/data
    ports:
      - 6379:6379
    command: sh -c "redis-server --requirepass ${REDIS_PASS}"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ../../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ${DATA_PATH}/postgres:/var/lib/postgresql/data
    ports:
      - 5432:5432
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    depends_on:
      - postgres
      - redis
    environment:
      WEB: http://localhost/
    volumes:
      # For hot reload in development
      - ../../backend:/app
    command: bash -c "uv run uvicorn app.main:app --host 0.0.0.0 --port 5000 --proxy-headers --reload"

  web:
    build:
      context: ../../frontend
      target: development
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API: http://localhost/api/
      NEXT_PUBLIC_WEB: http://localhost/
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      # For hot reload in development
      - ../../frontend:/app
      # Exclude to avoid conflicts and cache issues
      - /app/node_modules
      - /app/.next
      - /app/.swc
    command: npm run dev

  server:
    image: nginx:1.29
    restart: unless-stopped
    env_file: ../../.env
    volumes:
      - ../nginx/local.conf:/etc/nginx/nginx.conf
      - ${DATA_PATH}/load:/load
      - ${DATA_PATH}/logs:/data/logs
      - ${DATA_PATH}/sitemaps:/data/sitemaps
      - ${DATA_PATH}/sitemap.xml:/data/sitemap.xml
      - ${DATA_PATH}/robots.txt:/data/robots.txt
    ports:
      - ${EXTERNAL_PORT}:80
    depends_on:
      - api
      - web
